name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    # Pinned so that swift-format's output does not change under us.
    container: swift:6.3-noble
    steps:
      - uses: actions/checkout@v7
      - name: swift format lint
        run: swift format lint --strict --recursive --parallel Package.swift Sources Tests examples Benchmarks

  macos:
    name: macOS (latest stable Xcode)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Toolchain
        run: swift --version
      - name: Build (release)
        run: swift build -c release
      - name: Test
        run: swift test
      - name: Test with Thread Sanitizer
        run: swift test --sanitize=thread
      - name: Documentation (warnings as errors)
        run: scripts/build-docs.sh
      - name: Examples
        run: scripts/check-examples.sh
      - name: Benchmark smoke run
        run: swift run -c release sse-benchmark --quick

  linux:
    name: Linux (Swift ${{ matrix.swift }})
    runs-on: ubuntu-latest
    container: swift:${{ matrix.swift }}-noble
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.0", "6.3", "6.4"]
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: swift --version
      - name: Build (release)
        run: swift build -c release
      - name: Test
        run: swift test
      - name: Install Python for the example server
        run: command -v python3 || (apt-get update && apt-get install -y --no-install-recommends python3)
      - name: Examples
        run: scripts/check-examples.sh
