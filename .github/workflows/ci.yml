name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    # Pinned so that swift-format's output does not change under us.
    container: swift:6.3-noble
    steps:
      - uses: actions/checkout@v7
      - name: swift format lint
        run: swift format lint --strict --recursive --parallel Package.swift Sources Tests examples Benchmarks

  macos:
    name: macOS (latest stable Xcode)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Toolchain
        run: swift --version
      - name: Build (release)
        run: swift build -c release
      - name: Test
        run: swift test
      - name: Test with Thread Sanitizer
        run: swift test --sanitize=thread
      - name: Documentation (warnings as errors)
        run: scripts/build-docs.sh
      - name: Examples
        run: scripts/check-examples.sh
      - name: Benchmark smoke run
        run: swift run -c release sse-benchmark --quick

  apple-platforms:
    name: Build for ${{ matrix.platform }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            sdk: iphoneos
            triple: arm64-apple-ios16.0
          - platform: tvOS
            sdk: appletvos
            triple: arm64-apple-tvos16.0
          - platform: watchOS (arm64_32, 32-bit Int)
            sdk: watchos
            triple: arm64_32-apple-watchos9.0
          - platform: visionOS
            sdk: xros
            triple: arm64-apple-xros1.0
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      # Cross-compiles the libraries with the SDK that ships with Xcode; unlike xcodebuild, this
      # needs no simulator runtime. The minimum OS versions are the manifest's deployment targets.
      - name: Build SSE and SSELLM
        run: >-
          swift build --target SSELLM --triple "${{ matrix.triple }}"
          --sdk "$(xcrun --sdk ${{ matrix.sdk }} --show-sdk-path)"

  linux:
    name: Linux (Swift ${{ matrix.swift }})
    runs-on: ubuntu-latest
    container: swift:${{ matrix.swift }}-noble
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.0", "6.3", "6.4"]
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: swift --version
      - name: Build (release)
        run: swift build -c release
      - name: Test
        run: swift test
      - name: Install Python for the example server
        run: command -v python3 || (apt-get update && apt-get install -y --no-install-recommends python3)
      - name: Examples
        run: scripts/check-examples.sh
